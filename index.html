<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') return;

  /* ---------- CSS: canvas sits behind everything ---------- */
  const css = document.createElement('style');
  css.textContent = `
    #bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
    main,footer{position:relative;z-index:1}
    /* let the 3D scene show through the hero (photo replaced by a tinted overlay) */
    .hero{background:linear-gradient(115deg,rgba(8,36,25,.88) 0%,rgba(18,59,44,.72) 55%,rgba(31,107,74,.55) 100%) !important}
  `;
  document.head.appendChild(css);

  const canvas = document.createElement('canvas');
  canvas.id = 'bg3d';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.prepend(canvas);

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true }); }
  catch (e) { canvas.remove(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdfeee4, 16, 44);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.set(0, 0, 12);

  /* ---------- Lights ---------- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9fc8a8, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(5, 10, 7); scene.add(sun);
  const warm = new THREE.DirectionalLight(0xd9a441, 0.4); warm.position.set(-6, -2, 4); scene.add(warm);

  /* ---------- Low-poly house ---------- */
  const matCache = {};
  const mat = c => matCache[c] || (matCache[c] = new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.7, metalness: 0.05 }));
  const walls = [0xf5f0e4, 0xe9f4ed, 0x9fc8a8, 0x1f6b4a, 0xd9a441];
  const roofs = [0x1f6b4a, 0x123b2c, 0xb76e4d, 0xd9a441];
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function makeHouse() {
    const g = new THREE.Group();
    const add = (geo, color, x, y, z) => { const m = new THREE.Mesh(geo, mat(color)); m.position.set(x, y, z); g.add(m); return m; };
    add(new THREE.BoxGeometry(1.6, 1.1, 1.3), pick(walls), 0, 0.55, 0);
    const roof = add(new THREE.ConeGeometry(1.15, 0.8, 4), pick(roofs), 0, 1.5, 0);
    roof.rotation.y = Math.PI / 4;
    add(new THREE.BoxGeometry(0.28, 0.55, 0.05), 0x123b2c, 0, 0.275, 0.66);
    add(new THREE.BoxGeometry(0.28, 0.28, 0.05), 0x9fc8d0, -0.5, 0.65, 0.66);
    add(new THREE.BoxGeometry(0.28, 0.28, 0.05), 0x9fc8d0, 0.5, 0.65, 0.66);
    add(new THREE.BoxGeometry(0.2, 0.5, 0.2), 0x7a4a36, 0.5, 1.75, -0.2);
    return g;
  }

  const small = window.innerWidth < 700;
  const houses = [];
  const count = small ? 22 : 42;
  for (let i = 0; i < count; i++) {
    const h = makeHouse();
    const s = 0.6 + Math.random() * 0.9;
    h.scale.setScalar(s);
    h.position.set((Math.random() - 0.5) * (small ? 16 : 30), 4 - Math.random() * 34, -2 - Math.random() * 22);
    h.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.4);
    h.userData = { baseY: h.position.y, spin: (0.08 + Math.random() * 0.3) * (Math.random() < 0.5 ? -1 : 1), phase: Math.random() * 6.28, amp: 0.15 + Math.random() * 0.3 };
    scene.add(h); houses.push(h);
  }

  /* ---------- Drifting gold dust ---------- */
  const N = small ? 120 : 260, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 34; pos[i * 3 + 1] = 6 - Math.random() * 40; pos[i * 3 + 2] = -Math.random() * 24; }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xd9a441, size: 0.09, transparent: true, opacity: 0.75, depthWrite: false }));
  scene.add(dust);

  /* ---------- Interaction ---------- */
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  window.addEventListener('pointermove', e => { mouse.tx = (e.clientX / innerWidth - 0.5) * 2; mouse.ty = (e.clientY / innerHeight - 0.5) * 2; }, { passive: true });
  let scrollT = 0, scrollS = 0;
  const readScroll = () => { const max = document.documentElement.scrollHeight - innerHeight; scrollT = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0; };
  addEventListener('scroll', readScroll, { passive: true }); readScroll();

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motion = reduce ? 0 : 1;
  const clock = new THREE.Clock();

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    mouse.x += (mouse.tx - mouse.x) * 0.05; mouse.y += (mouse.ty - mouse.y) * 0.05;
    scrollS += (scrollT - scrollS) * 0.06;
    camera.position.set(mouse.x * 1.4, -scrollS * 30 - mouse.y * 0.6, 12);
    camera.lookAt(mouse.x * 0.4, camera.position.y, -10);
    for (const h of houses) {
      const d = h.userData;
      h.rotation.y += dt * d.spin * motion;
      h.position.y = d.baseY + Math.sin(t * 0.6 + d.phase) * d.amp * motion;
    }
    dust.rotation.y = t * 0.01 * motion;
    renderer.render(scene, camera);
  }
  frame();
})();
</script>
